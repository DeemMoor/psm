# Локальная разработка в Docker. Прод (BeGet shared) — отдельно, см. docs/deploy-beget.md.
# Первый запуск:  make init   →  сайт на http://localhost:8083
# Порты нестандартные (8083/3308/5175), чтобы не конфликтовать с другими локальными проектами.
services:
  # PHP 8.5 + FPM — выполняет код Symfony.
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app/backend
    volumes:
      - ./:/app
    depends_on:
      - db

  # nginx — веб-сервер, отдаёт сайт и шлёт PHP в контейнер php.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8083:80"            # сайт открывается на http://localhost:8083
    volumes:
      - ./:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  # MySQL — база данных. Креды тут ДЕВ-овые и одноразовые (контейнер локальный),
  # боевые пароли будут в backend/.env.local на сервере (в git не идут).
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: psm
      MYSQL_USER: psm
      MYSQL_PASSWORD: psm
    ports:
      # Хостовый порт 3308 (внутри контейнера — 3306). Приложение ходит по db:3306.
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Node — дев-сервер и сборка React.
  node:
    image: node:22-alpine
    working_dir: /app/frontend
    user: "1000:1000"
    volumes:
      - ./:/app
    ports:
      - "5175:5175"          # дев-сервер Vite
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
