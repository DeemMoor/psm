services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/app/backend
    command: sh -c "composer install && php-fpm"
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/app/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: graphite_vanes
      MYSQL_USER: graphite
      MYSQL_PASSWORD: graphite
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  node:
    image: node:22-alpine
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./:/app
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run build && npm run dev"

volumes:
  db_data:
